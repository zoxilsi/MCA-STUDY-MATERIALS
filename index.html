    <!-- Predefined Tailwind CSS, use it as needed, or update base on your -->
    <style type="text/tailwindcss">
        @layer base {
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                @apply bg-white dark:bg-gray-900 text-black dark:text-white transition-colors duration-200;
            }
        }

    @layer components {
        .note-card {
            @apply bg-white dark:bg-gray-800 text-black dark:text-white rounded-xl p-6 border-3 border-black dark:border-gray-600 shadow-[6px_6px_0px_0px_rgba(0,0,0,0.9)] dark:shadow-[6px_6px_0px_0px_rgba(255,255,255,0.1)] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,0.9)] dark:hover:shadow-[8px_8px_0px_0px_rgba(255,255,255,0.1)] transition-all duration-200;
        }

        .btn-primary {
            @apply py-3 px-6 bg-blue-500 text-white font-black text-sm rounded-lg border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,0.9)] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,0.9)] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,0.9)] transition-all duration-200;
        }

        .btn-secondary {
            @apply py-3 px-6 bg-white dark:bg-gray-700 text-black dark:text-white font-black text-sm rounded-lg border-2 border-black dark:border-gray-600 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.9)] dark:shadow-[4px_4px_0px_0px_rgba(255,255,255,0.1)] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,0.9)] dark:hover:shadow-[6px_6px_0px_0px_rgba(255,255,255,0.1)] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,0.9)] dark:active:shadow-[2px_2px_0px_0px_rgba(255,255,255,0.1)] transition-all duration-200;
        }
    }

    @layer utilities {
        .border-3 {
            border-width: 3px;
        }
    }
     @keyframes fadeInOut {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .animate-fade-in-out {
      animation: fadeInOut 1s infinite;
    }

         .visibility-hidden {
            visibility: hidden;
        }

        @keyframes slideIn {
            0% {
                transform: translateX(-35px);
                opacity: 0;
                visibility: hidden;
            }
            50%{
                opacity: 0.5;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
                visibility: visible;
            }
        }

        .animate-menu-item {
            animation: slideIn 0.5s ease-out forwards;
        }

        .animate-menu-item[data-index="0"] { animation-delay: 0.1s; }
        .animate-menu-item[data-index="1"] { animation-delay: 0.3s; }
        .animate-menu-item[data-index="2"] { animation-delay: 0.5s; }
        .animate-menu-item[data-index="3"] { animation-delay: 0.8s; }
        .animate-menu-item[data-index="4"] { animation-delay: 1.0s; }
        .animate-menu-item[data-index="5"] { animation-delay: 1.3s; }
        .animate-menu-item[data-index="6"] { animation-delay: 1.5s; }
    </style>
