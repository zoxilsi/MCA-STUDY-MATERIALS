<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Tracker & End-Sem Predictor</title>
    
    <!-- Tailwind CSS for a modern, responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Link to your custom CSS file -->
    <link rel="stylesheet" href="marks-tracker.css">
    
    <!-- Google Fonts for a professional look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Theme Toggle Button -->
    <button id="theme-toggle-btn">🌙</button>

    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        
        <!-- Header Section -->
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold">Marks Tracker</h1>
            <p class="text-lg mt-2">Plan your studies by tracking internal marks and predicting end-sem needs.</p>
        </header>

        <!-- Main Controls -->
        <div class="flex justify-center mb-8">
            <button id="add-course-btn" class="add-course-button">
                + Add New Course
            </button>
        </div>

        <!-- Container where course cards will be dynamically inserted by JavaScript -->
        <main id="courses-container" class="space-y-8">
            <!-- Initial message or course cards will appear here -->
        </main>

    </div>

    <!-- Link to your application logic -->
    <script src="marks-tracker.js"></script>
</body>
</html>
